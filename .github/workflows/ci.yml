name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lua syntax and test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # lupa provides a real Lua runtime, which the stubbed WoW API runs on top of.
      - name: Install lupa
        run: python -m pip install --quiet lupa

      - name: Run the test suite
        run: python tests/run_tests.py
